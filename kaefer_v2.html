<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KAEFER Safety Tool v2</title>
<style>
/* ============================================================
   KAEFER SAFETY TOOL V2 — Phase 1 Foundation
   One file, modular inside. Mobile-first. Colour-coded by role.
============================================================ */

:root {
  /* Brand */
  --brand: #CC0000;
  --brand-dark: #990000;
  --charcoal: #1a1a1a;
  --ink: #212121;
  --mute: #607d8b;
  --line: #e0e0e0;
  --line-strong: #bdbdbd;
  --surface: #ffffff;
  --surface-2: #fafafa;
  --surface-3: #f3f5f7;

  /* Tab accent palette */
  --t-dashboard: #37474f;
  --t-attendance: #1b5e20;
  --t-manning: #1565c0;
  --t-daily: #ef6c00;
  --t-hours: #4527a0;
  --t-offsite: #00695c;
  --t-inspections: #c62828;
  --t-submissions: #6a1b9a;
  --t-actions: #2e7d32;
  --t-registers: #00838f;
  --t-rr: #ad1457;
  --t-scaffold: #283593;
  --t-reports: #455a64;

  /* Status */
  --ok: #2e7d32;
  --warn: #f57c00;
  --err: #c62828;
  --info: #1565c0;

  /* Scale */
  --r-sm: 4px;
  --r-md: 6px;
  --r-lg: 10px;
  --shadow-1: 0 1px 2px rgba(0,0,0,.06);
  --shadow-2: 0 4px 14px rgba(0,0,0,.08);
  --shadow-3: 0 10px 28px rgba(0,0,0,.14);

  /* Font */
  --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font);
  color: var(--ink);
  background: var(--surface-3);
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }

/* ---------- Header ---------- */
.topbar {
  background: var(--charcoal);
  color: #fff;
  padding: 10px 18px;
  display: flex;
  align-items: center;
  gap: 14px;
  border-bottom: 3px solid var(--brand);
}
.topbar .brand {
  font-weight: 900;
  font-size: 20px;
  letter-spacing: .5px;
  color: #fff;
  background: var(--brand);
  padding: 4px 10px;
  border-radius: var(--r-sm);
}
.topbar .site {
  display: flex;
  flex-direction: column;
  line-height: 1.1;
}
.topbar .site .t { font-weight: 700; font-size: 13px; }
.topbar .site .s { font-size: 11px; color: #bdbdbd; margin-top: 2px; }
.topbar .spacer { flex: 1; }
.topbar .ver {
  background: rgba(255,255,255,.08);
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
}
.topbar .who {
  font-size: 12px;
  color: #e0e0e0;
}
.topbar .hamb {
  display: none;
  background: transparent;
  border: 1px solid rgba(255,255,255,.3);
  color: #fff;
  width: 36px;
  height: 36px;
  border-radius: var(--r-sm);
  font-size: 18px;
  cursor: pointer;
}

/* ---------- Tab bar ---------- */
.tabwrap {
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  overflow-x: auto;
  scroll-behavior: smooth;
  position: sticky;
  top: 0;
  z-index: 10;
}
.tabs {
  display: flex;
  padding: 0 10px;
  gap: 0;
  min-width: max-content;
}
.tab {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 12px 14px;
  background: transparent;
  border: 0;
  border-bottom: 3px solid transparent;
  color: var(--mute);
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: color .12s, border-color .12s, background .12s;
}
.tab:hover { color: var(--ink); background: var(--surface-2); cursor: grab; }
.tab:active { cursor: grabbing; }
.tab[aria-current="true"] {
  color: var(--ink);
  border-bottom-color: var(--accent, var(--brand));
}
.tab[aria-current="true"] .dot {
  background: var(--accent, var(--brand));
}
.tab .dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--mute);
  opacity: .55;
}
.tab[aria-current="true"] .dot { opacity: 1; }

/* ---------- Status bar ---------- */
.statusbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 18px;
  background: var(--surface-2);
  border-bottom: 1px solid var(--line);
  font-size: 11.5px;
  color: var(--mute);
}
.statusbar .dot-s {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--ok);
  box-shadow: 0 0 0 2px rgba(46,125,50,.15);
}
.statusbar .dot-s.warn { background: var(--warn); box-shadow: 0 0 0 2px rgba(245,124,0,.15); }
.statusbar .dot-s.err { background: var(--err); box-shadow: 0 0 0 2px rgba(198,40,40,.15); }
.statusbar .dot-s.idle { background: var(--line-strong); box-shadow: none; }
.statusbar .pill {
  background: var(--surface);
  border: 1px solid var(--line);
  padding: 2px 7px;
  border-radius: 999px;
  font-weight: 600;
  color: var(--ink);
}
.statusbar .spacer { flex: 1; }
.statusbar button {
  background: transparent;
  border: 1px solid var(--line);
  padding: 3px 10px;
  border-radius: var(--r-sm);
  cursor: pointer;
  font-size: 11px;
  color: var(--ink);
}
.statusbar button:hover { background: var(--surface); }

/* ---------- Main stage ---------- */
.stage {
  padding: 18px;
  max-width: 1400px;
  margin: 0 auto;
}
.card {
  background: var(--surface);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-1);
  overflow: hidden;
  margin-bottom: 16px;
  border: 1px solid var(--line);
}
.card-h {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--line);
  background: var(--surface-2);
}
.card-h .accent {
  width: 4px;
  align-self: stretch;
  background: var(--accent, var(--brand));
  border-radius: 2px;
  margin: -12px 0;
}
.card-h h2 {
  margin: 0;
  font-size: 14px;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: .2px;
}
.card-h .sub { color: var(--mute); font-size: 11.5px; margin-left: auto; }
.card-b { padding: 16px; }

/* ---------- Placeholder (Coming soon panel) ---------- */
.phstage {
  display: grid;
  gap: 14px;
}
.phcard {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 4px solid var(--accent, var(--mute));
  border-radius: var(--r-lg);
  padding: 18px;
  box-shadow: var(--shadow-1);
}
.phcard h3 {
  margin: 0 0 6px;
  font-size: 15px;
  font-weight: 700;
}
.phcard .phase {
  display: inline-block;
  background: var(--accent, var(--mute));
  color: #fff;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
  margin-right: 8px;
  text-transform: uppercase;
}
.phcard p { margin: 6px 0 0; color: var(--mute); font-size: 13px; }
.phcard ul { margin: 10px 0 0; padding-left: 18px; color: var(--ink); font-size: 13px; }
.phcard ul li { margin: 2px 0; }
.phcard .status {
  position: absolute;
  top: 14px;
  right: 14px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--mute);
  background: var(--surface-2);
  padding: 3px 8px;
  border-radius: var(--r-sm);
  border: 1px solid var(--line);
}

/* ---------- Hero (dashboard) ---------- */
.hero {
  background: linear-gradient(135deg, var(--charcoal), #37474f);
  color: #fff;
  padding: 22px 20px;
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-2);
  margin-bottom: 18px;
  position: relative;
  overflow: hidden;
}
.hero::after {
  content: "";
  position: absolute;
  top: -40px;
  right: -40px;
  width: 200px;
  height: 200px;
  background: radial-gradient(circle, rgba(204,0,0,.35), transparent 60%);
  pointer-events: none;
}
.hero h1 {
  margin: 0 0 4px;
  font-size: 22px;
  font-weight: 800;
  letter-spacing: .3px;
}
.hero p {
  margin: 0;
  color: #cfd8dc;
  font-size: 13.5px;
}
.hero .meta {
  margin-top: 14px;
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  font-size: 12px;
  color: #b0bec5;
}
.hero .meta span strong { color: #fff; font-weight: 700; }

/* ---------- Mobile ---------- */
@media (max-width: 820px) {
  .topbar .site .s { display: none; }
  .topbar .hamb { display: inline-flex; align-items: center; justify-content: center; margin-left: auto; }
  .topbar .ver, .topbar .who { display: none; }
  .tabwrap.collapsed { display: none; }
  .tabwrap:not(.collapsed) {
    position: fixed;
    top: 60px;
    left: 0;
    right: 0;
    background: var(--surface);
    box-shadow: var(--shadow-3);
    z-index: 50;
    max-height: calc(100vh - 60px);
    overflow-y: auto;
  }
  .tabwrap:not(.collapsed) .tabs {
    flex-direction: column;
    padding: 6px 0;
    min-width: 0;
  }
  .tabwrap:not(.collapsed) .tab {
    border-bottom: 1px solid var(--line);
    border-left: 4px solid transparent;
    padding: 14px 18px;
    font-size: 14px;
  }
  .tabwrap:not(.collapsed) .tab[aria-current="true"] {
    border-left-color: var(--accent, var(--brand));
    background: var(--surface-2);
  }
  .stage { padding: 12px; }
  .hero { padding: 18px; }
  .hero h1 { font-size: 18px; }
}

/* ---------- Utility ---------- */
.row { display: flex; gap: 12px; align-items: center; }
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--brand);
  color: #fff;
  border: 0;
  padding: 8px 14px;
  border-radius: var(--r-sm);
  font-weight: 700;
  cursor: pointer;
  font-size: 13px;
}
.btn:hover { background: var(--brand-dark); }
.btn.ghost {
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--line);
}
.btn.ghost:hover { background: var(--surface-2); }

/* Scrollbar polish */
.tabwrap::-webkit-scrollbar { height: 4px; }
.tabwrap::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 2px; }

</style>
</head>
<body>

<!-- ===================== HEADER ===================== -->
<header class="topbar">
  <div class="brand">KAEFER</div>
  <div class="site">
    <div class="t">Safety &amp; Operations Tool</div>
    <div class="s">Rio Tinto Yarwun · KAEFER Integrated Services</div>
  </div>
  <div class="spacer"></div>
  <div class="ver">v2 Preview</div>
  <div class="who" id="hdr-who">Steve Middleton</div>
  <button class="hamb" onclick="toggleNav()" aria-label="Menu">☰</button>
</header>

<!-- ===================== TAB BAR ===================== -->
<nav class="tabwrap collapsed" id="tabwrap">
  <div class="tabs" id="tabs"></div>
</nav>

<!-- ===================== STATUS BAR ===================== -->
<div class="statusbar">
  <span class="dot-s" id="sync-dot"></span>
  <span id="sync-txt">Connected · last sync just now</span>
  <span class="pill" id="sync-env">v2 preview</span>
  <div class="spacer"></div>
  <button onclick="alert('Sync now (Phase 1 wiring not live yet)')">↻ Sync now</button>
</div>

<!-- ===================== STAGE ===================== -->
<main class="stage" id="stage"></main>

<script>
/* ============================================================
   TABS CONFIG
   Each tab carries its own accent colour (--accent var), phase,
   and a short placeholder of what will land there.
   Phase 1 tabs will render their real content once wired.
============================================================ */
const TABS = [
  { id:'dashboard',   label:'Dashboard',         accent:'var(--t-dashboard)',   phase:1, status:'in build',
    desc:'A single live overview — today\'s crew size, open actions, recent inspections, this week\'s shortfall, upcoming expiries. First screen you see every morning.' },
  { id:'daily',       label:'Daily Meeting',     accent:'var(--t-daily)',       phase:2, status:'coming',
    desc:'Big-screen view for the morning team meeting. Today\'s jobs down the left (dragged from Hours Register), team composition down the right pulled live from Attendance & Offsite.' },
  { id:'attendance',  label:'Attendance',        accent:'var(--t-attendance)',  phase:1, status:'in build',
    desc:'The v2 attendance grid you already have. Click a date cell to cycle through statuses, up/down arrows to reorder, migrate from v1 one-click.' },
  { id:'manning',     label:'Direct Manning',    accent:'var(--t-manning)',     phase:1, status:'in build',
    desc:'Daily baseline vs actual crew count, weekly override, shortfall review, counted/shortfall chart. Reads straight from Attendance.' },
  { id:'hours',       label:'Hours Register',    accent:'var(--t-hours)',       phase:4, status:'coming',
    desc:'Paste the week\'s Excel register in Monday morning. Colour-coded status (fully editable palette), notes column, MON–SUN tick strip to send jobs to Daily Meeting view. One-click "Copy incomplete jobs" for client email.' },
  { id:'offsite',     label:'Offsite Register',  accent:'var(--t-offsite)',     phase:2, status:'coming',
    desc:'Who went offsite, when, why. Feeds Direct Manning so offsite ≠ absent. Fast log entry.' },
  { id:'inspections', label:'Inspections',       accent:'var(--t-inspections)', phase:2, status:'coming',
    desc:'Daily inspections. Permanent IDs, standard sync. Keeps all current fields, cleaner entry flow.' },
  { id:'submissions', label:'Submissions',       accent:'var(--t-submissions)', phase:2, status:'coming',
    desc:'Staff form submissions. Approve, reject, log.' },
  { id:'actions',     label:'Actions',           accent:'var(--t-actions)',     phase:2, status:'coming',
    desc:'Open and closed actions with owner, due date, status. Cleaned up status/priority taxonomy.' },
  { id:'registers',   label:'Registers',         accent:'var(--t-registers)',   phase:3, status:'coming',
    desc:'One unified registers framework powering PPE, Vehicle, Tool, Training, Breathalyser, Heights, Tool Users. Same UI, same sync, 7 configurations.' },
  { id:'rr',          label:'R&R',               accent:'var(--t-rr)',          phase:3, status:'coming',
    desc:'Recognition log with Smart Choices tags, Edit on each row, "In Portal" tick to track what\'s been pushed to KAEFER\'s portal.' },
  { id:'scaffold',    label:'Scaffold Register', accent:'var(--t-scaffold)',    phase:3, status:'coming',
    desc:'Scaffold inventory, erect / dismantle status, inspections due.' },
  { id:'ccv',         label:'CCV Wheel',         accent:'var(--t-rr)',          phase:3, status:'coming',
    desc:'Critical control verification wheel. Keep the visualisation, standardise entry.' },
  { id:'reports',     label:'Reporting',         accent:'var(--t-reports)',     phase:4, status:'coming',
    desc:'Planned vs Unplanned (from Hours Register), Quarterly, CRM. Read-only aggregations.' }
];

/* State */
let ACTIVE = 'dashboard';

/* ============================================================
   RENDER
============================================================ */
/* Tab order persistence — stored per browser */
function loadTabOrder() {
  try {
    const saved = JSON.parse(localStorage.getItem('kaefer_v2_tab_order') || '[]');
    if (!Array.isArray(saved) || !saved.length) return;
    // Reorder TABS array to match saved order, keeping any new tabs at the end
    const idMap = Object.fromEntries(TABS.map(t => [t.id, t]));
    const ordered = [];
    saved.forEach(id => { if (idMap[id]) { ordered.push(idMap[id]); delete idMap[id]; } });
    Object.values(idMap).forEach(t => ordered.push(t));
    TABS.length = 0;
    TABS.push(...ordered);
  } catch(e) {}
}
function saveTabOrder() {
  try { localStorage.setItem('kaefer_v2_tab_order', JSON.stringify(TABS.map(t => t.id))); } catch(e) {}
}

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = TABS.map((t, i) =>
    `<button class="tab" draggable="true" data-idx="${i}" style="--accent:${t.accent}" aria-current="${t.id===ACTIVE}" onclick="setTab('${t.id}')">
       <span class="dot"></span>${t.label}
     </button>`
  ).join('');
  wireTabDrag();
}

/* Drag-to-reorder */
let dragFromIdx = null;
function wireTabDrag() {
  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('dragstart', e => {
      dragFromIdx = parseInt(btn.dataset.idx, 10);
      btn.style.opacity = '0.4';
      e.dataTransfer.effectAllowed = 'move';
    });
    btn.addEventListener('dragend', () => { btn.style.opacity = ''; dragFromIdx = null; });
    btn.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; });
    btn.addEventListener('drop', e => {
      e.preventDefault();
      const toIdx = parseInt(btn.dataset.idx, 10);
      if (dragFromIdx == null || dragFromIdx === toIdx) return;
      const moved = TABS.splice(dragFromIdx, 1)[0];
      TABS.splice(toIdx, 0, moved);
      saveTabOrder();
      renderTabs();
    });
  });
}

function setTab(id) {
  ACTIVE = id;
  document.querySelectorAll('.tab').forEach((b,i)=>{
    b.setAttribute('aria-current', TABS[i].id===id);
  });
  renderStage();
  // auto-collapse mobile nav after a pick
  if (window.innerWidth <= 820) document.getElementById('tabwrap').classList.add('collapsed');
}

function renderStage() {
  const t = TABS.find(x => x.id === ACTIVE);
  const stage = document.getElementById('stage');
  if (t.id === 'dashboard') {
    stage.innerHTML = renderDashboard();
    return;
  }
  stage.innerHTML = `
    <div class="hero" style="background: linear-gradient(135deg, var(--charcoal), ${t.accent.replace('var(--t-','').replace(')','')}); background: linear-gradient(135deg, var(--charcoal), ${t.accent});">
      <h1>${t.label}</h1>
      <p>${t.desc}</p>
      <div class="meta">
        <span><strong>Phase ${t.phase}</strong></span>
        <span>Status: <strong>${t.status}</strong></span>
      </div>
    </div>
    <div class="card">
      <div class="card-h"><span class="accent" style="--accent:${t.accent}"></span><h2>What's coming here</h2></div>
      <div class="card-b">
        <p style="margin:0;color:var(--mute);font-size:13.5px">This tab lands in <b>Phase ${t.phase}</b>. The design is set — rebuild is the only thing left. Preview the look and feel through the Dashboard tab, which is in build now alongside Attendance and Direct Manning.</p>
      </div>
    </div>
  `;
}

function renderDashboard() {
  // All tabs grouped by phase for an at-a-glance progress board
  const byPhase = {};
  TABS.forEach(t => { (byPhase[t.phase] = byPhase[t.phase] || []).push(t); });
  const phases = Object.keys(byPhase).sort();
  return `
    <div class="hero">
      <h1>KAEFER Safety Tool v2 — Phase 1</h1>
      <p>New foundation. New palette. Mobile-friendly. Attendance, Direct Manning and this Dashboard first.</p>
      <div class="meta">
        <span>Build date <strong>${new Date().toLocaleDateString('en-AU')}</strong></span>
        <span>Supervisor <strong>Steve Middleton</strong></span>
        <span>Site <strong>Rio Tinto Yarwun</strong></span>
      </div>
    </div>

    <div class="card">
      <div class="card-h"><span class="accent"></span><h2>Rebuild roadmap</h2><span class="sub">${TABS.length} tabs total</span></div>
      <div class="card-b">
        <div class="phstage">
          ${phases.map(p => `
            <div class="phcard" style="--accent:${phaseColour(p)}">
              <span class="status">Phase ${p}</span>
              <h3>${phaseTitle(p)}</h3>
              <p>${phaseIntro(p)}</p>
              <ul>${byPhase[p].map(t => `<li><b>${t.label}</b> — ${t.desc.split('.')[0]}.</li>`).join('')}</ul>
            </div>
          `).join('')}
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-h"><span class="accent" style="--accent:var(--t-attendance)"></span><h2>What's working today</h2></div>
      <div class="card-b">
        <p style="margin:0 0 10px;color:var(--mute);font-size:13px">This is the Phase 1 skeleton. The chrome, palette and tab system are live. Attendance and Direct Manning get plugged in next — they'll light up those tabs with real data.</p>
        <div class="row" style="margin-top:8px">
          <button class="btn" onclick="setTab('attendance')">Preview Attendance tab</button>
          <button class="btn ghost" onclick="setTab('manning')">Preview Direct Manning tab</button>
        </div>
      </div>
    </div>
  `;
}

function phaseColour(p) {
  return ({1:'var(--t-attendance)', 2:'var(--t-daily)', 3:'var(--t-registers)', 4:'var(--t-reports)'})[p] || 'var(--mute)';
}
function phaseTitle(p) {
  return ({
    1:'Foundation + Daily data',
    2:'Daily tools',
    3:'Registers & records',
    4:'Reporting & integrations'
  })[p];
}
function phaseIntro(p) {
  return ({
    1:'Shell, sync layer, design system, Attendance + Direct Manning + Dashboard. Live now in preview.',
    2:'The tabs you touch every day: Daily Meeting view, Inspections, Submissions, Actions, Offsite Register.',
    3:'Registers framework (seven variants in one), R&R, Scaffold Register, CCV Wheel.',
    4:'Hours Register import, Reporting (PV / Quarterly / CRM), Smart Forms sign-on OCR. V1 archived.'
  })[p];
}

function toggleNav() {
  document.getElementById('tabwrap').classList.toggle('collapsed');
}

/* ---------- Sync status demo (fake for now) ---------- */
function updateSync() {
  const dot = document.getElementById('sync-dot');
  const txt = document.getElementById('sync-txt');
  const now = new Date().toLocaleTimeString('en-AU', {hour12:false, hour:'2-digit', minute:'2-digit'});
  dot.className = 'dot-s';
  txt.textContent = 'Connected · last sync ' + now;
}
setInterval(updateSync, 60000);

/* ---------- Init ---------- */
loadTabOrder();
renderTabs();
renderStage();
updateSync();

/* On desktop show tab bar; on mobile keep collapsed until tapped */
if (window.innerWidth > 820) {
  document.getElementById('tabwrap').classList.remove('collapsed');
}
</script>
</body>
</html>
